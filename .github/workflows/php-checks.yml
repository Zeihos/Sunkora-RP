name: PHP security and syntax

on:
  push:
    paths:
      - 'Сайт/**'
      - 'Форум/**'
      - 'Вики/**'
      - 'tools/**'
      - '.github/workflows/php-checks.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify PHP exists
        run: php -v
      - name: Lint all PHP files
        shell: bash
        run: |
          set -euo pipefail
          find 'Сайт' 'Форум' 'Вики' tools -type f -name '*.php' -print0 |
            xargs -0 -r -n1 php -l
      - name: Verify installation secrets fail closed
        run: php tools/verify-install-keys.php
      - name: Test private data storage and access rules
        run: php tools/test-storage-security.php
      - name: Test external site storage
        run: php tools/test-site-storage.php
      - name: Test atomic site writes and POST length limit
        run: php tools/test-site-reliability.php
      - name: Test Cyrillic account registration and login lookup
        run: php tools/test-site-accounts.php
      - name: Test external forum storage and safe redirects
        run: php tools/test-forum-storage.php
      - name: Verify repository structure and assets
        run: php tools/verify-repository.php
