name: Pawn Compile

on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/pawn-build.yml'

permissions:
  contents: read

jobs:
  detect-sources:
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.detect.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for game source
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for file in server/gamemodes/sunkora.pwn server/filterscripts/other.pwn server/BUILD-LINUX.sh; do
            if [ ! -f "$file" ]; then
              echo "::notice file=$file::Game source is not present in the repository yet."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Pawn compilation skipped (no game sources uploaded)." >> "$GITHUB_STEP_SUMMARY"
          fi

  compile:
    needs: detect-sources
    if: needs.detect-sources.outputs.present == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download official pinned Pawn compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pawnc"
          curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/openmultiplayer/compiler/releases/download/v3.10.11/pawnc-3.10.11-linux.tar.gz' \
            -o "$RUNNER_TEMP/pawnc.tar.gz"
          tar -xzf "$RUNNER_TEMP/pawnc.tar.gz" -C "$RUNNER_TEMP/pawnc"
          PAWNCC="$(find "$RUNNER_TEMP/pawnc" -type f -name pawncc -print -quit)"
          test -n "$PAWNCC" || { echo 'PawnCC not found in archive'; exit 3; }
          chmod +x "$PAWNCC"
          printf 'PAWNCC=%s\n' "$PAWNCC" >> "$GITHUB_ENV"
      - name: Compile server
        shell: bash
        run: |
          set -euo pipefail
          cd server
          bash BUILD-LINUX.sh
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pawn-compile-logs
          path: server/logs/compile-*.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload compiled gamemode
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sunkora-amx
          path: |
            server/gamemodes/sunkora.amx
            server/filterscripts/other.amx
          if-no-files-found: error
          retention-days: 14
